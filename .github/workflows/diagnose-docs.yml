name: Diagnose docs endpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-docs.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check samgiri-chainwise-api.vercel.app
        run: |
          echo "--- /docs/ (following redirect, full body) ---"
          curl -sS -D - -L "https://samgiri-chainwise-api.vercel.app/docs/" -o /tmp/docs_slash.html || true
          echo "--- body length ---"
          wc -c /tmp/docs_slash.html || true
          echo "--- full body ---"
          cat /tmp/docs_slash.html || true
          echo
          echo "--- swagger-ui asset check ---"
          curl -sS -o /dev/null -w "swagger-ui-bundle.js: %{http_code}\n" "https://samgiri-chainwise-api.vercel.app/docs/swagger-ui-bundle.js" || true
          curl -sS -o /dev/null -w "swagger-ui.css: %{http_code}\n" "https://samgiri-chainwise-api.vercel.app/docs/swagger-ui.css" || true
          echo "--- /api/health ---"
          curl -sS "https://samgiri-chainwise-api.vercel.app/api/health" || true
          echo
