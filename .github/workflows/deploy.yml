name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Type-check / build
        run: npm run build

      - name: Link Vercel project
        run: npx --yes vercel@latest link --yes --project chainwise-api-production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: |
          ENV_FLAGS=(
            --env DATABASE_URL="$DATABASE_URL"
            --env ETHERSCAN_API_KEY="$ETHERSCAN_API_KEY"
            --env CORS_ORIGIN="https://thechainwise.com"
            --env FRONTEND_URL="https://thechainwise.com"
            --env NODE_ENV="production"
          )
          # Telegram credentials are added by the user after creating a bot via
          # BotFather, so they may not exist as GitHub secrets yet -- skip them
          # rather than passing an empty --env value, which the Vercel CLI rejects.
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            ENV_FLAGS+=(--env TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN")
          fi
          if [ -n "$WEBHOOK_SECRET" ]; then
            ENV_FLAGS+=(--env WEBHOOK_SECRET="$WEBHOOK_SECRET")
          fi
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" "${ENV_FLAGS[@]}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}

      - name: Wait for deployment to be reachable
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://chainwise-api-production.vercel.app/api/health || echo 000)
            if [ "$code" != "000" ]; then echo "reachable (HTTP $code)"; exit 0; fi
            echo "not reachable yet, retrying..."; sleep 3
          done
          echo "Deployment never became reachable"; exit 1

      - name: Configure Telegram webhook
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN not set yet -- skipping webhook registration until a bot is created via BotFather"
            exit 0
          fi
          resp=$(curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -d "url=https://chainwise-api-production.vercel.app/webhook/telegram" \
            -d "secret_token=${WEBHOOK_SECRET}")
          echo "$resp"
          echo "$resp" | jq -e '.ok == true' >/dev/null || (echo "FAIL: setWebhook failed" && exit 1)
          echo "PASS: Telegram webhook configured"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}

      - name: Test - health check
        run: |
          resp=$(curl -sS https://chainwise-api-production.vercel.app/api/health)
          echo "$resp"
          echo "$resp" | grep -q '"status":"ok"' || (echo "FAIL: health check did not report ok" && exit 1)
          echo "$resp" | grep -q '"database":"connected"' || (echo "FAIL: database not connected" && exit 1)
          echo "PASS: health check"

      - name: Test - subscribe endpoint
        run: |
          email="ci-test-$(date +%s)@example.com"
          resp=$(curl -sS -X POST https://chainwise-api-production.vercel.app/api/subscribe \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$email\",\"source\":\"ci-test\"}")
          echo "$resp"
          echo "$resp" | grep -q '"success":true' || (echo "FAIL: subscribe did not succeed" && exit 1)
          echo "PASS: subscribe endpoint"

      - name: Test - analyze endpoint
        run: |
          resp=$(curl -sS -m 10 -w "\n%{time_total}" -X POST https://chainwise-api-production.vercel.app/api/analyze \
            -H "Content-Type: application/json" \
            -d '{"protocol_address":"0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48","chain":"ethereum"}')
          body=$(echo "$resp" | head -n -1)
          time_total=$(echo "$resp" | tail -n 1)
          echo "$body"
          echo "response time: ${time_total}s"
          echo "$body" | grep -q '"risk_score"' || (echo "FAIL: analyze response missing risk_score" && exit 1)
          echo "$body" | grep -q '"classification"' || (echo "FAIL: analyze response missing classification" && exit 1)
          echo "$body" | grep -q '"layers"' || (echo "FAIL: analyze response missing layers breakdown" && exit 1)
          awk -v t="$time_total" 'BEGIN { exit !(t < 5) }' || (echo "FAIL: response time ${time_total}s exceeded 5s budget" && exit 1)
          echo "PASS: analyze endpoint"

      - name: Test - cases list endpoint (pagination + chain filter)
        run: |
          # Single request covers array shape, pagination, chain filtering, and locating
          # the seeded case (it's on "ethereum") all at once, to stay well under the
          # 20-req/min global rate limit shared across every test step in this job.
          resp=$(curl -sS "https://chainwise-api-production.vercel.app/api/cases?chain=ethereum&limit=5")
          echo "$resp"
          echo "$resp" | jq -e '.cases | type == "array"' >/dev/null || (echo "FAIL: cases is not an array" && exit 1)
          echo "$resp" | jq -e '.pagination.limit == 5' >/dev/null || (echo "FAIL: pagination.limit mismatch" && exit 1)
          echo "$resp" | jq -e '[.cases[].chain] | all(. == "ethereum")' >/dev/null || (echo "FAIL: chain filter returned non-ethereum results" && exit 1)
          case_id=$(echo "$resp" | jq -r '.cases[] | select(.protocol_name == "Example Protocol Zeta") | .id' | head -n1)
          if [ -z "$case_id" ]; then echo "FAIL: seeded case study not found in list"; exit 1; fi
          echo "SEEDED_CASE_ID=$case_id" >> "$GITHUB_ENV"
          echo "PASS: cases list endpoint (seeded case id=$case_id, pagination + chain filter OK)"

      - name: Test - case detail endpoint
        run: |
          resp=$(curl -sS "https://chainwise-api-production.vercel.app/api/cases/${SEEDED_CASE_ID}")
          echo "$resp" | head -c 400
          echo
          echo "$resp" | jq -e '.risk_score == 95' >/dev/null || (echo "FAIL: risk_score mismatch" && exit 1)
          echo "$resp" | jq -e '.classification == "MLM Pyramid Scheme"' >/dev/null || (echo "FAIL: classification mismatch" && exit 1)
          echo "$resp" | jq -e '.case_study_html != null' >/dev/null || (echo "FAIL: missing case_study_html" && exit 1)
          echo "$resp" | jq -e '.analysis != null' >/dev/null || (echo "FAIL: missing analysis breakdown" && exit 1)

          code=$(curl -s -o /dev/null -w "%{http_code}" "https://chainwise-api-production.vercel.app/api/cases/999999999")
          [ "$code" = "404" ] || (echo "FAIL: expected 404 for nonexistent case, got $code" && exit 1)
          echo "PASS: case detail endpoint (found + 404 for missing)"

      - name: Test - Swagger docs + openapi.json
        run: |
          # swagger-ui-express 301s /docs -> /docs/ so relative asset URLs resolve; that
          # redirect itself is sufficient proof the router is wired correctly, and not
          # following it saves a request against the shared rate-limit budget.
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://chainwise-api-production.vercel.app/docs")
          [ "$code" = "200" ] || [ "$code" = "301" ] || (echo "FAIL: /docs returned $code" && exit 1)
          echo "PASS: /docs reachable (HTTP $code)"

          spec=$(curl -sS "https://chainwise-api-production.vercel.app/openapi.json")
          echo "$spec" | head -c 500
          echo
          echo "$spec" | jq -e '.info.title == "ChainWise API"' >/dev/null || (echo "FAIL: openapi.json malformed or wrong title" && exit 1)
          echo "$spec" | jq -e '.paths."/api/cases" != null and .paths."/api/analyze" != null' >/dev/null || (echo "FAIL: openapi.json missing documented paths" && exit 1)
          echo "PASS: Swagger docs + openapi.json"

      - name: Test - Telegram webhook auth + command handling
        run: |
          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "WEBHOOK_SECRET not set yet -- skipping webhook tests"
            exit 0
          fi

          # Unauthorized request must be rejected regardless of body.
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://chainwise-api-production.vercel.app/webhook/telegram" \
            -H "Content-Type: application/json" \
            -d '{"message":{"chat":{"id":1},"text":"/help"}}')
          [ "$code" = "401" ] || (echo "FAIL: expected 401 without secret header, got $code" && exit 1)

          # Authorized synthetic Telegram update should be accepted and processed.
          # chat.id 1 isn't a real chat, so the bot's downstream sendMessage call to
          # Telegram will itself fail (logged server-side, not surfaced here) -- this
          # only verifies our webhook's own auth + parsing, since a real end-to-end
          # reply requires an actual Telegram conversation this CI environment can't provide.
          code2=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://chainwise-api-production.vercel.app/webhook/telegram" \
            -H "Content-Type: application/json" \
            -H "X-Telegram-Bot-Api-Secret-Token: $WEBHOOK_SECRET" \
            -d '{"message":{"chat":{"id":1},"text":"/help"}}')
          [ "$code2" = "200" ] || (echo "FAIL: expected 200 for authorized synthetic update, got $code2" && exit 1)
          echo "PASS: webhook auth + command handling"
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}

      - name: Test - JavaScript SDK (build + examples against live API)
        run: |
          cd sdk-js
          npm ci
          npm run build
          echo "-- analyze.js --"
          node examples/analyze.js
          echo "-- list-cases.js --"
          node examples/list-cases.js
          echo "-- subscribe.js --"
          TEST_EMAIL="ci-js-sdk-$(date +%s)@example.com" node examples/subscribe.js
          echo "PASS: JavaScript SDK"

      - name: Test - Python SDK (install + examples against live API)
        run: |
          cd sdk-py
          pip install -e .
          echo "-- analyze.py --"
          python examples/analyze.py
          echo "-- list_cases.py --"
          python examples/list_cases.py
          echo "-- subscribe.py --"
          TEST_EMAIL="ci-py-sdk-$(date +%s)@example.com" python examples/subscribe.py
          echo "PASS: Python SDK"

      - name: Publish JavaScript SDK to npm
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN not set yet -- skipping npm publish"
            exit 0
          fi
          cd sdk-js
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view "@chainwise/sdk@${CURRENT_VERSION}" version >/dev/null 2>&1; then
            echo "@chainwise/sdk@${CURRENT_VERSION} is already published -- skipping (bump the version to publish a new release)"
            exit 0
          fi
          npm publish
          echo "PASS: published @chainwise/sdk@${CURRENT_VERSION}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Python SDK to PyPI
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "PYPI_TOKEN not set yet -- skipping PyPI publish"
            exit 0
          fi
          cd sdk-py
          CURRENT_VERSION=$(python setup.py --version)
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/chainwise/${CURRENT_VERSION}/json")
          if [ "$code" = "200" ]; then
            echo "chainwise==${CURRENT_VERSION} is already published -- skipping (bump the version to publish a new release)"
            exit 0
          fi
          pip install --quiet build twine
          python -m build
          twine upload dist/* -u __token__ -p "$PYPI_TOKEN"
          echo "PASS: published chainwise==${CURRENT_VERSION}"
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Test - rate limiting (11 requests in a burst)
        run: |
          statuses=""
          for i in $(seq 1 11); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://chainwise-api-production.vercel.app/api/health)
            statuses="$statuses $code"
          done
          echo "Statuses for 11 requests:$statuses"
          echo "$statuses" | grep -q "429" && echo "PASS: rate limiting triggered a 429" || echo "WARN: no 429 seen in this burst (see note on serverless statefulness)"
